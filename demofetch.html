<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Fetch in JS</title>
      <table border="1" cellpadding="4" cellspacing="0">
        <th>
            <tr>
                <th>Sr No:</th>
                <th>Tittle</th>
                <th>Category</th>
                <th>Description</th>
                <th>Price</th>
            </tr>
        </th>
        <tbody id="data1">

        </tbody>
    </table>
    <script>
        const URL="https://dummyjson.com/products"
        async  function laodProduct(){
            try{
                const ele= document.getElementById("data1");
                const res = await fetch(URL);
                const data = await res.json();
                console.log("Data=" ,data);
              data.products.map((i) => {
                
                ele.innerHTML +=  `<tr>
                     <td> ${i.id}</td>
                      <td>  ${i.title} </td>
                       <td>   ${i.category} </td>
                         <td>   ${i.description} </td>
                           <td>   ${i.price} </td>

                    </tr>`
                })
            }
            catch(err){
                console.log("ERROR",err)
            }

        }
        laodProduct();

      
       

    </script>

    <style>
        table{
            background-color: aqua;
            margin: auto;
            padding: 20px;
            color: brown;
            border: 2px solid blue;
            
           
        }
    </style>
</head>

</body>
</html>
